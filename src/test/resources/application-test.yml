spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:h2:mem:userservice_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
    username: ${TEST_DB_USERNAME:sa}
    password: ${TEST_DB_PASSWORD:}
    driver-class-name: ${TEST_DB_DRIVER:org.h2.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 0
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

logging:
  level:
    root: INFO
    com.iosocket.userservice: DEBUG
    org.springframework.security: WARN

app:
  security:
    cors:
      allowed-origins: http://localhost:3000
      allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      allowed-headers: Authorization,Content-Type,X-Request-Id,Accept,Origin
      allow-credentials: true
      max-age-seconds: 3600
    jwt:
      issuer: user-service-test
      audience: user-service-test-api
      access-token-expiry-minutes: 15
      refresh-token-expiry-days: 7
      private-key-location: ""
      public-key-location: ""
    auth:
      max-failed-attempts: 5
      lockout-duration-minutes: 15
